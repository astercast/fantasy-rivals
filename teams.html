<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teams · Rivals Fantasy</title>
<meta name="theme-color" content="#0b0d1c">
<meta property="og:title" content="Teams · Rivals Fantasy">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rivals Fantasy">
<meta property="og:description" content="The pro teams of the Marvel Rivals Ignite circuit, with rosters by role.">
<meta property="og:image" content="/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Teams · Rivals Fantasy">
<meta name="twitter:description" content="The pro teams of the Marvel Rivals Ignite circuit, with rosters by role.">
<meta name="twitter:image" content="/assets/og-card.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="description" content="The pro teams of the Marvel Rivals Ignite circuit, with rosters by role.">
<link rel="preload" href="/assets/fonts/anton-latin-normal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<header class="site-head" data-chrome-head></header>

<section class="section">
  <div class="wrap">
    <div class="section-head"><h1>Pro teams</h1><span class="spacer"></span><span class="fine" data-note></span></div>
    <div data-regions class="stack"></div>
  </div>
</section>

<footer class="site-foot" data-chrome-foot></footer>
<script type="module">
  import { renderChrome, fetchJson, esc, GAME_SLUG } from "/assets/js/site.js";
  renderChrome("teams");
  const data = await fetchJson(`/data/v1/${GAME_SLUG}-teams.json`);
  document.querySelector("[data-note]").textContent = `Rosters as published for the 2026 season. Teams marked “roster pending” are confirmed in the competition; their current lineups are being verified before they enter the draft pool. Teams carrying a Partner tag are the circuit's twelve partner organizations, with guaranteed league spots for 2026.`;
  const byRegion = {};
  for (const t of data.teams) (byRegion[t.region || ""] ||= []).push(t);
  const roleClass = (r) => r === "Vanguard" ? "van" : r === "Duelist" ? "due" : "str";
  document.querySelector("[data-regions]").innerHTML = Object.entries(byRegion).map(([region, teams]) => `
    <div>
      <p class="kicker" style="margin:18px 0 12px">${esc(region)}</p>
      <div class="grid grid-3">
        ${teams.map((t) => {
          const roster = data.players.filter((p) => p.team === t.short);
          return `<div class="card">
            <h3>${esc(t.name)} <span class="mono fine">${esc(t.short)}</span>${t.partner ? ` <span class="role partner">Partner</span>` : ""}</h3>
            ${roster.length ? `<div style="margin-top:10px">${roster.map((p) => `
              <div style="display:flex; gap:10px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line)">
                <span style="font-weight:600">${esc(p.ign)}</span>
                <span class="spacer" style="flex:1"></span>
                <span class="role ${roleClass(p.role)}">${esc(p.role)}</span>
              </div>`).join("")}</div>`
            : `<p class="fine" style="margin-top:8px">Roster pending verification</p>`}
          </div>`;
        }).join("")}
      </div>
    </div>`).join("");
</script>
</body>
</html>
