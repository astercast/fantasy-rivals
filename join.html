<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a league · Rivals Fantasy</title>
<meta name="theme-color" content="#0b0d1c">
<meta name="description" content="Join a Rivals Fantasy league with an invite code and draft your squad of Marvel Rivals pros.">
<meta property="og:title" content="Join a league · Rivals Fantasy">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rivals Fantasy">
<meta property="og:description" content="Join a Rivals Fantasy league with an invite code and draft your squad of Marvel Rivals pros.">
<meta property="og:image" content="/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Join a league · Rivals Fantasy">
<meta name="twitter:description" content="Join a Rivals Fantasy league with an invite code and draft your squad of Marvel Rivals pros.">
<meta name="twitter:image" content="/assets/og-card.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/anton-latin-normal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<header class="site-head" data-chrome-head></header>

<section class="section">
  <div class="wrap">
    <div class="form-card">
      <h1 style="font-size:30px; margin-bottom:8px">Join a league</h1>
      <p class="muted" style="margin-bottom:24px">Enter the invite code from your commissioner, name your team, and you're in the draft room queue.</p>
      <div class="alert error" data-alert></div>
      <div class="alert info" data-need-auth>
        You need an account first, <a href="/signup.html">create one</a> or <a href="/login.html">sign in</a>, then come back to this page.
      </div>
      <form data-join-form>
        <div class="field"><label for="code">Invite code</label><input id="code" required style="text-transform:uppercase" autocomplete="off"></div>
        <div class="field"><label for="team">Your team name</label><input id="team" required placeholder="e.g. Dive Comp Enjoyers"></div>
        <button class="btn btn-accent" style="width:100%" type="submit">Join league</button>
      </form>
    </div>
  </div>
</section>

<footer class="site-foot" data-chrome-foot></footer>
<script type="module">
  import { renderChrome, api } from "/assets/js/site.js";
  renderChrome("");
  const alertBox = document.querySelector("[data-alert]");
  const showError = (msg) => { alertBox.textContent = msg; alertBox.classList.add("show"); };
  const codeInput = document.getElementById("code");
  const fromLink = new URLSearchParams(location.search).get("code");
  if (fromLink) codeInput.value = fromLink.toUpperCase();
  const { user } = await api("/api/auth/me").catch(() => ({ user: null }));
  if (user) document.querySelector("[data-need-auth]").classList.remove("show");
  else document.querySelector("[data-need-auth]").classList.add("show");
  document.querySelector("[data-join-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!user) return showError("Sign in first, then join.");
    try {
      const { league } = await api("/api/leagues/join", {
        method: "POST",
        body: JSON.stringify({ code: codeInput.value.trim(), teamName: document.getElementById("team").value }),
      });
      location.href = `/league.html?id=${league.id}`;
    } catch (err) { showError(err.message); }
  });
</script>
</body>
</html>
