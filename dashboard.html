<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My leagues · Rivals Fantasy</title>
<meta name="theme-color" content="#0a1224">
<meta name="description" content="Your Rivals Fantasy leagues in one place: drafts, lineups, weekly matchups, standings and scores.">
<meta property="og:title" content="My leagues · Rivals Fantasy">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rivals Fantasy">
<meta property="og:description" content="Your Rivals Fantasy leagues in one place: drafts, lineups, weekly matchups, standings and scores.">
<meta property="og:image" content="/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="My leagues · Rivals Fantasy">
<meta name="twitter:description" content="Your Rivals Fantasy leagues in one place: drafts, lineups, weekly matchups, standings and scores.">
<meta name="twitter:image" content="/assets/og-card.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/archivo-latin-normal-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<header class="site-head" data-chrome-head></header>

<section class="section">
  <div class="wrap">
    <div class="section-head">
      <h1>My leagues</h1>
      <span class="spacer"></span>
      <a class="btn" href="/start.html?mode=join">Join with a code</a>
      <a class="btn btn-primary" href="/start.html">Create a league</a>
    </div>
    <div class="alert error" data-alert></div>
    <div data-leagues></div>
    <div data-empty class="hidden" style="padding:48px 0">
      <h3 style="font-size:20px">No leagues yet</h3>
      <p class="muted" style="margin:8px 0 24px">Create one for the live competition, or join a friend's with their invite code.</p>
      <a class="btn btn-primary" href="/start.html">Create your first league</a>
    </div>
  </div>
</section>

<footer class="site-foot" data-chrome-foot></footer>
<script type="module">
  import { renderChrome, api, esc } from "/assets/js/site.js";
  renderChrome("dashboard");
  const statusLabel = { forming: "Forming, invites open", drafting: "Draft is live", active: "Season running", playoffs: "Playoffs", complete: "Complete" };
  const nextAction = { forming: "Open league", drafting: "Go to the draft", active: "Set your lineup", playoffs: "See the bracket", complete: "Final table" };
  try {
    const { leagues } = await api("/api/leagues");
    const box = document.querySelector("[data-leagues]");
    if (!leagues.length) document.querySelector("[data-empty]").classList.remove("hidden");
    box.innerHTML = leagues.map((l) => `
      <a class="league-row" href="/league.html?id=${l.id}">
        <span>
          <span class="l-name">${esc(l.name)}</span>
          <span class="l-meta" style="display:block">${esc(statusLabel[l.status] || l.status)} · your team: <strong>${esc(l.team_name)}</strong> · ${l.member_count}/${l.size} teams</span>
        </span>
        ${l.status === "drafting" ? `<span class="tag-live">Draft live</span>` : ""}
        <span class="l-act btn btn-small">${esc(nextAction[l.status] || "Open league")}</span>
      </a>`).join("");
  } catch (err) {
    if (err.status === 401) location.href = "/auth.html";
    const a = document.querySelector("[data-alert]");
    a.textContent = err.message; a.classList.add("show");
  }
</script>
</body>
</html>
