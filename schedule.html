<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule &amp; results · Rivals Fantasy</title>
<meta name="theme-color" content="#0b0d1c">
<meta property="og:title" content="Schedule &amp; results · Rivals Fantasy">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rivals Fantasy">
<meta property="og:description" content="Fixtures and results for the live Marvel Rivals competition, the matches your fantasy weeks are scored from.">
<meta property="og:image" content="/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Schedule &amp; results · Rivals Fantasy">
<meta name="twitter:description" content="Fixtures and results for the live Marvel Rivals competition, the matches your fantasy weeks are scored from.">
<meta name="twitter:image" content="/assets/og-card.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="description" content="Fixtures and results for the live Marvel Rivals competition, the matches your fantasy weeks are scored from.">
<link rel="preload" href="/assets/fonts/anton-latin-normal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<header class="site-head" data-chrome-head></header>

<section class="plate" data-season-plate></section>

<section class="section">
  <div class="wrap">
    <div class="section-head"><h1>Schedule &amp; results</h1><span class="spacer"></span><span class="fine" data-note></span></div>
    <div data-fixtures></div>
  </div>
</section>

<footer class="site-foot" data-chrome-foot></footer>
<script type="module">
  import { renderChrome, renderSeasonPlate, fetchJson, fmtDate, esc, GAME_SLUG } from "/assets/js/site.js";
  renderChrome("schedule");
  renderSeasonPlate(document.querySelector("[data-season-plate]"));
  const [sched, teamsData] = await Promise.all([
    fetchJson(`/data/v1/${GAME_SLUG}-schedule.json`),
    fetchJson(`/data/v1/${GAME_SLUG}-teams.json`),
  ]);
  const teamName = Object.fromEntries(teamsData.teams.map((t) => [t.short, t.name]));
  const el = document.querySelector("[data-fixtures]");
  document.querySelector("[data-note]").textContent = sched.matches.length
    ? `Results are imported from published match lines and named with their source.`
    : "";
  if (!sched.matches.length) {
    el.innerHTML = `<div class="wire-line"><span class="w-name">Fixtures publish with the competition</span><span class="w-fact">The current competition's series are imported here as they are scheduled and played, each with its source. Fantasy weeks map to these series.</span></div>`;
  } else {
    /* Fixtures in wire form (study 2): one line per series, teams, round,
       state word, date, and the score as the appended fact on finals.
       Grouped by fantasy week, the wire's date grouping. */
    const byWeek = {};
    for (const m of sched.matches) (byWeek[m.week] ||= []).push(m);
    el.innerHTML = Object.entries(byWeek).map(([week, ms]) => `
      <div class="wire-group">
        <p class="wire-date">Fantasy week ${esc(week)}</p>
        ${ms.map((m) => `
          <div class="wire-line">
            <span class="w-name">${esc(teamName[m.teamA] || m.teamA)} vs ${esc(teamName[m.teamB] || m.teamB)}</span>
            <span class="w-stage">${esc(m.roundLabel || "")}</span>
            <span class="w-state">${m.status === "final" ? "Final" : "Scheduled"}</span>
            <span class="w-dates">${fmtDate(m.startsAt)}</span>
            ${m.scoreA == null ? "" : `<span class="w-fact">${m.scoreA} to ${m.scoreB}</span>`}
          </div>`).join("")}
      </div>`).join("");
  }
</script>
</body>
</html>
