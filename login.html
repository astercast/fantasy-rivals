<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Rivals Fantasy</title>
<meta name="theme-color" content="#fafaf7">
<meta property="og:title" content="Sign in · Rivals Fantasy">
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<header class="site-head" data-chrome-head></header>

<section class="section">
  <div class="wrap">
    <div class="form-card">
      <h1 style="font-size:30px; margin-bottom:8px">Sign in</h1>
      <p class="muted" style="margin-bottom:24px">One click with the account you already have.</p>
      <div class="alert error" data-alert></div>
      <div class="stack" data-providers></div>
      <div class="divider">or with email</div>
      <form data-login-form>
        <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary" style="width:100%" type="submit">Sign in with email</button>
      </form>
      <p class="small muted" style="margin-top:18px">New here? <a href="/signup.html">Create an account</a>, same buttons, same deal.</p>
    </div>
  </div>
</section>

<footer class="site-foot" data-chrome-foot></footer>
<script type="module">
  import { renderChrome, api } from "/assets/js/site.js";
  renderChrome("");
  const alertBox = document.querySelector("[data-alert]");
  const showError = (msg) => { alertBox.textContent = msg; alertBox.classList.add("show"); };
  const oauthError = new URLSearchParams(location.search).get("oauth_error");
  if (oauthError) showError(oauthError);

  const { providers } = await api("/api/auth/me").catch(() => ({ providers: {} }));
  const box = document.querySelector("[data-providers]");
  const btn = (provider, label, glyph, configured, note) => `
    <a class="btn btn-provider" ${configured ? `href="/api/auth/oauth-start?provider=${provider}"` : 'aria-disabled="true" style="opacity:.55; pointer-events:none"'}>
      <span class="glyph">${glyph}</span> Continue with ${label}
    </a>
    ${configured ? "" : `<p class="fine" style="margin:8px 0 4px">${note}</p>`}`;
  box.innerHTML =
    btn("google", "Google", "G", providers.google, "Google sign-in activates at launch, email works today.") +
    btn("x", "X", "𝕏", providers.x, "X sign-in activates at launch, email works today.") +
    (providers.dev ? btn("dev", "Dev account", "⚙", true, "") : "");

  document.querySelector("[data-login-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api("/api/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      location.href = "/dashboard.html";
    } catch (err) { showError(err.message); }
  });
</script>
</body>
</html>
