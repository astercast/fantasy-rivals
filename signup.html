<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create your account · Rivals Fantasy</title>
<meta name="theme-color" content="#fafaf7">
<meta name="description" content="Create a Rivals Fantasy account with Google, X, or email, and start a league in minutes.">
<meta property="og:title" content="Create your account · Rivals Fantasy">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rivals Fantasy">
<meta property="og:description" content="Create a Rivals Fantasy account with Google, X, or email, and start a league in minutes.">
<meta property="og:image" content="/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Create your account · Rivals Fantasy">
<meta name="twitter:description" content="Create a Rivals Fantasy account with Google, X, or email, and start a league in minutes.">
<meta name="twitter:image" content="/assets/og-card.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
<header class="site-head" data-chrome-head></header>

<section class="section">
  <div class="wrap">
    <div class="form-card">
      <h1 style="font-size:30px; margin-bottom:8px">Create your account</h1>
      <p class="muted" style="margin-bottom:24px">Free. One account for every game on the site, forever.</p>
      <div class="alert error" data-alert></div>
      <div class="stack" data-providers></div>
      <div class="divider">or with email</div>
      <form data-signup-form>
        <div class="field"><label for="name">Display name</label><input id="name" required autocomplete="nickname" placeholder="How your leagues see you"></div>
        <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="new-password" minlength="8" placeholder="8+ characters"></div>
        <button class="btn btn-primary" style="width:100%" type="submit">Create account</button>
      </form>
      <p class="small muted" style="margin-top:18px">Already have one? <a href="/login.html">Sign in</a>.</p>
    </div>
  </div>
</section>

<footer class="site-foot" data-chrome-foot></footer>
<script type="module">
  import { renderChrome, api } from "/assets/js/site.js";
  renderChrome("");
  const alertBox = document.querySelector("[data-alert]");
  const showError = (msg) => { alertBox.textContent = msg; alertBox.classList.add("show"); };
  const { providers } = await api("/api/auth/me").catch(() => ({ providers: {} }));
  const box = document.querySelector("[data-providers]");
  const btn = (provider, label, glyph, configured, note) => `
    <a class="btn btn-provider" ${configured ? `href="/api/auth/oauth-start?provider=${provider}"` : 'aria-disabled="true" style="opacity:.55; pointer-events:none"'}>
      <span class="glyph">${glyph}</span> Continue with ${label}
    </a>
    ${configured ? "" : `<p class="fine" style="margin:8px 0 4px">${note}</p>`}`;
  box.innerHTML =
    btn("google", "Google", "G", providers.google, "Google sign-in activates at launch, email works today.") +
    btn("x", "X", "𝕏", providers.x, "X sign-in activates at launch, email works today.") +
    (providers.dev ? btn("dev", "Dev account", "⚙", true, "") : "");

  document.querySelector("[data-signup-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api("/api/auth/signup", {
        method: "POST",
        body: JSON.stringify({
          displayName: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      location.href = "/dashboard.html";
    } catch (err) { showError(err.message); }
  });
</script>
</body>
</html>
