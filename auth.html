<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="built" content="2026-10-24T13:46:16.956Z">
<title>Sign in · Rivals Fantasy</title>
<meta name="theme-color" content="#0C0D0F">
<meta name="description" content="Sign in to Rivals Fantasy with Google, X, or your email, or create an account.">
<meta property="og:title" content="Sign in · Rivals Fantasy">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Rivals Fantasy">
<meta property="og:description" content="Sign in to Rivals Fantasy with Google, X, or your email, or create an account.">
<meta property="og:image" content="/assets/og-card.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sign in · Rivals Fantasy">
<meta name="twitter:description" content="Sign in to Rivals Fantasy with Google, X, or your email, or create an account.">
<meta name="twitter:image" content="/assets/og-card.jpg">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/saira-latin-normal-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/main.css">
<link rel="stylesheet" href="/assets/css/profile.css">
<link rel="stylesheet" href="/assets/css/status.css">
<link rel="stylesheet" href="/assets/css/pulse.css">
</head>
<body>
<header class="site-head" data-chrome-head></header>

<!-- One auth page, two modes. Sign in and create account share the
     providers and the email form's shape; the mode switch is one line. -->
<section class="section">
  <div class="wrap">
    <div class="form-card">
      <h1 class="page-title" style="margin-bottom:8px" data-heading>Sign in</h1>
      <p class="muted" style="margin-bottom:24px" data-sub>One click with the account you already have.</p>
      <div class="alert error" data-alert></div>
      <div class="stack" data-providers></div>
      <div class="divider">or with email</div>

      <form data-login-form>
        <div class="field"><label for="li-email">Email</label><input id="li-email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="li-password">Password</label><input id="li-password" type="password" required autocomplete="current-password"></div>
        <button class="btn btn-primary" style="width:100%" type="submit">Sign in with email</button>
      </form>

      <form data-signup-form class="hidden">
        <div class="field"><label for="su-name">Display name</label><input id="su-name" required autocomplete="nickname" placeholder="How your leagues see you"></div>
        <div class="field"><label for="su-email">Email</label><input id="su-email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="su-password">Password</label><input id="su-password" type="password" required autocomplete="new-password" minlength="8" placeholder="8+ characters"></div>
        <button class="btn btn-primary" style="width:100%" type="submit">Create account</button>
      </form>

      <p class="small muted" style="margin-top:24px" data-switch-line>
        New here? <a href="/auth.html?mode=signup" data-switch>Create an account</a>
      </p>
    </div>
  </div>
</section>

<footer class="site-foot" data-chrome-foot></footer>
<script type="module">
  import { renderChrome, api } from "/assets/js/site.js";
  renderChrome("auth");
  const alertBox = document.querySelector("[data-alert]");
  const showError = (msg) => { alertBox.textContent = msg; alertBox.classList.add("show"); };
  const oauthError = new URLSearchParams(location.search).get("oauth_error");
  if (oauthError) showError(oauthError);

  const { providers } = await api("/api/auth/me").catch(() => ({ providers: {} }));
  const box = document.querySelector("[data-providers]");
  const btn = (provider, label, glyph, configured, note) => `
    <a class="btn btn-provider" ${configured ? `href="/api/auth/oauth-start?provider=${provider}"` : 'aria-disabled="true" style="opacity:.55; pointer-events:none"'}>
      <span class="glyph">${glyph}</span> Continue with ${label}
    </a>
    ${configured ? "" : `<p class="fine" style="margin:8px 0 4px">${note}</p>`}`;
  box.innerHTML =
    btn("google", "Google", "G", providers.google, "Google sign-in activates at launch.") +
    btn("x", "X", "𝕏", providers.x, "X sign-in activates at launch.") +
    (providers.dev ? btn("dev", "Dev account", "⚙", true, "") : "");

  function setMode(mode) {
    const signup = mode === "signup";
    document.querySelector("[data-login-form]").classList.toggle("hidden", signup);
    document.querySelector("[data-signup-form]").classList.toggle("hidden", !signup);
    document.querySelector("[data-heading]").textContent = signup ? "Create your account" : "Sign in";
    document.querySelector("[data-sub]").textContent = signup
      ? "Free. One account for every game on the site."
      : "One click with the account you already have.";
    document.title = signup ? "Create your account · Rivals Fantasy" : "Sign in · Rivals Fantasy";
    document.querySelector("[data-switch-line]").innerHTML = signup
      ? `Already have one? <a href="/auth.html" data-switch>Sign in</a>`
      : `New here? <a href="/auth.html?mode=signup" data-switch>Create an account</a>`;
    bindSwitch();
  }
  function bindSwitch() {
    document.querySelector("[data-switch]")?.addEventListener("click", (e) => {
      e.preventDefault();
      const signup = document.querySelector("[data-signup-form]").classList.contains("hidden");
      history.replaceState(null, "", signup ? "/auth.html?mode=signup" : "/auth.html");
      setMode(signup ? "signup" : "signin");
    });
  }
  setMode(new URLSearchParams(location.search).get("mode") === "signup" ? "signup" : "signin");

  document.querySelector("[data-login-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api("/api/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("li-email").value,
          password: document.getElementById("li-password").value,
        }),
      });
      location.href = "/dashboard.html";
    } catch (err) { showError(err.message); }
  });
  document.querySelector("[data-signup-form]").addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await api("/api/auth/signup", {
        method: "POST",
        body: JSON.stringify({
          displayName: document.getElementById("su-name").value,
          email: document.getElementById("su-email").value,
          password: document.getElementById("su-password").value,
        }),
      });
      location.href = "/dashboard.html";
    } catch (err) { showError(err.message); }
  });
</script>
</body>
</html>
